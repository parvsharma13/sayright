name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version && xcrun --show-sdk-version

      - name: Test
        run: make test

      - name: Build disk image
        run: make dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            build/SayRight.dmg \
            --title "SayRight $RELEASE_TAG" \
            --notes "## Install

          1. Download **SayRight.dmg** below and open it.
          2. Drag **SayRight** onto the **Applications** folder.
          3. Open SayRight from Applications and grant Accessibility access when asked.

          **This build is not notarised by Apple**, so macOS blocks it the first time. To allow it,
          open **System Settings > Privacy & Security**, scroll down and click **Open Anyway**
          next to the SayRight message. Or run this once in Terminal:

          \`\`\`sh
          xattr -d com.apple.quarantine /Applications/SayRight.app
          \`\`\`

          After an update, macOS asks for Accessibility access again because the signature
          changes. Building from source with \`make install\` avoids both steps — see
          [docs/SETUP.md](https://github.com/${REPOSITORY}/blob/main/docs/SETUP.md).

          Changes: [CHANGELOG.md](https://github.com/${REPOSITORY}/blob/main/CHANGELOG.md)."
