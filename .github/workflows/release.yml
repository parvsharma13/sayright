name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version && xcrun --show-sdk-version

      - name: Test
        run: make test

      - name: Build app bundle
        run: make bundle CONFIG=release

      - name: Zip
        run: ditto -c -k --keepParent build/SayRight.app "SayRight-${RELEASE_TAG}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "SayRight-${RELEASE_TAG}.zip" \
            --title "SayRight $RELEASE_TAG" \
            --notes "See [CHANGELOG.md](https://github.com/${REPOSITORY}/blob/main/CHANGELOG.md).

          **This build is ad-hoc signed, not notarized.** macOS will refuse to open it until you
          clear the quarantine flag:

          \`\`\`sh
          xattr -d com.apple.quarantine /Applications/SayRight.app
          \`\`\`

          Because the signature differs from your previous install, macOS will also ask for
          Accessibility access again. Building from source with \`make install\` avoids both —
          see [docs/SETUP.md](https://github.com/${REPOSITORY}/blob/main/docs/SETUP.md)."
