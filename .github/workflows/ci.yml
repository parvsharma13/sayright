name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: swift --version && xcrun --show-sdk-version

      - name: Test
        run: make test

      - name: Build app bundle
        run: make bundle CONFIG=release

      - name: Zip
        run: ditto -c -k --keepParent build/SayRight.app SayRight.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SayRight-unsigned
          path: SayRight.zip
